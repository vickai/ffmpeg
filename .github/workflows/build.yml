name: Build Static FFmpeg Windows (libfdk_aac Single EXE)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      PREFIX: ${{ github.workspace }}/build_out
      W64DIR: ${{ github.workspace }}/w64devkit
    steps:
      - name: Download w64devkit v2.9.1 (latest)
        run: |
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v2.9.1/w64devkit-x64.exe" -OutFile w64devkit.exe
          .\w64devkit.exe -o$env:W64DIR -y
          echo "$env:W64DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build static fdk-aac
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          mkdir build && cd build
          cmake -G "Unix Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%PREFIX% ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON ^
            ..
          make -j%NUMBER_OF_PROCESSORS%
          make install

      - name: Build FFmpeg fully static
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          set PKG_CONFIG_PATH=%PREFIX%/lib/pkgconfig
          ./configure ^
            --prefix=%PREFIX% ^
            --target-os=mingw32 ^
            --arch=x86_64 ^
            --enable-gpl ^
            --enable-nonfree ^
            --enable-libfdk-aac ^
            --enable-libmp3lame ^
            --enable-libopus ^
            --enable-libx264 ^
            --enable-libx265 ^
            --enable-libvpx ^
            --enable-static ^
            --disable-shared ^
            --disable-debug ^
            --disable-ffplay ^
            --disable-doc ^
            --extra-cflags="-I%PREFIX%/include" ^
            --extra-ldflags="-L%PREFIX%/lib -static -static-libgcc -static-libstdc++" ^
            --extra-libs="-lpthread"
          make -j%NUMBER_OF_PROCESSORS%
          make install

      - name: Package artifacts
        shell: cmd
        run: |
          mkdir artifact
          copy %PREFIX%\bin\ffmpeg.exe artifact\
          copy %PREFIX%\bin\ffprobe.exe artifact\
          cd artifact
          powershell Compress-Archive -Path *.exe -DestinationPath ffmpeg-win64-static.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-static
          path: artifact/ffmpeg-win64-static.zip
