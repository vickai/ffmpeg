name: Build FFmpeg Windows (libfdk_aac)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel git yasm nasm zip unzip
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-lame mingw-w64-x86_64-x264 mingw-w64-x86_64-x265
            mingw-w64-x86_64-libvpx mingw-w64-x86_64-opus

      - name: Compile static fdk-aac
        shell: msys2 {0}
        run: |
          git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          mkdir build && cd build
          cmake -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          make -j$(nproc)
          make install
          # 校验安装结果
          pkg-config --modversion fdk-aac

      - name: Compile FFmpeg
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
          git clone --depth=1 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          ./configure \
            --target-os=mingw64 \
            --arch=x86_64 \
            --enable-gpl \
            --enable-nonfree \
            --enable-libfdk-aac \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --disable-shared \
            --enable-static \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --extra-libs="-lpthread"
          make -j$(nproc)
          make install
          # 检查是否开启fdk_aac
          grep CONFIG_LIBFDK_AAC config.h

      - name: Collect all binaries + required DLLs
        shell: msys2 {0}
        run: |
          mkdir -p output
          cp /mingw64/bin/ffmpeg.exe output/
          cp /mingw64/bin/ffprobe.exe output/
          # 必须复制运行依赖DLL！解决双击无输出
          cp /mingw64/bin/libwinpthread-1.dll output/
          cp /mingw64/bin/libgcc_s_seh-1.dll output/
          cp /mingw64/bin/libstdc++-6.dll output/
          cd output
          zip -r ffmpeg-win64-full.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-with-fdkaac
          path: output/ffmpeg-win64-full.zip
