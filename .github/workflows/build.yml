name: Build FFmpeg Windows FDK AAC Audiobook Edition


on:

  workflow_dispatch:

  push:
    branches: [ main ]



env:

  FF_VERSION: n9.0


jobs:


  build:


    runs-on: windows-2022


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install MSYS2
      uses: msys2/setup-msys2@v2

      with:

        msystem: MINGW64

        update: true

        install: >-
          git
          make
          yasm
          nasm
          pkg-config
          autoconf
          automake
          libtool
          gcc
          mingw-w64-x86_64-toolchain



    - name: Setup PATH

      shell: bash

      run: |

        echo "/mingw64/bin" >> $GITHUB_PATH

        git config --global core.autocrlf false

        git config --global http.version HTTP/1.1



    #############################################
    # libfdk-aac
    #############################################

    - name: Build libfdk-aac

      shell: msys2 {0}

      run: |

        cd /tmp

        git clone \
          --depth=1 \
          https://github.com/mstorsjo/fdk-aac.git


        cd fdk-aac


        autoreconf -fiv


        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared


        make -j$(nproc)

        make install




    #############################################
    # libmp3lame
    #############################################

    - name: Build libmp3lame

      shell: msys2 {0}

      run: |

        cd /tmp


        git clone \
          --depth=1 \
          https://github.com/lameproject/lame.git


        cd lame


        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared \
          --disable-frontend


        make -j$(nproc)

        make install




    #############################################
    # libopus
    #############################################

    - name: Build libopus

      shell: msys2 {0}

      run: |

        cd /tmp


        git clone \
          --depth=1 \
          https://github.com/xiph/opus.git


        cd opus


        autoreconf -fiv


        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared \
          --disable-extra-programs


        make -j$(nproc)

        make install




    #############################################
    # FFmpeg
    #############################################

    - name: Clone FFmpeg

      shell: msys2 {0}

      run: |

        cd /tmp


        git clone \
          --depth=1 \
          --branch n9.0 \
          https://github.com/FFmpeg/FFmpeg.git ffmpeg


        cd ffmpeg


        git checkout $FF_VERSION




    - name: Configure FFmpeg

      shell: msys2 {0}

      run: |

        cd /tmp/ffmpeg


        ./configure \
          --prefix=/mingw64 \
          --pkg-config-flags="--static" \
          --extra-cflags="-static" \
          --extra-ldflags="-static" \
          --extra-libs="-lpthread -lws2_32 -lwinmm" \
          --arch=x86_64 \
          --target-os=mingw32 \
          --enable-cross-compile \
          --cc=x86_64-w64-mingw32-gcc \
          --enable-nonfree \
          --enable-version3 \
          --enable-static \
          --disable-shared \
          --disable-debug \
          --disable-doc \
          --disable-ffplay \
          --enable-ffprobe \
          --enable-libfdk_aac \
          --enable-libmp3lame \
          --enable-libopus




    - name: Compile FFmpeg

      shell: msys2 {0}

      run: |

        cd /tmp/ffmpeg


        make -j$(nproc)




    - name: Install FFmpeg

      shell: msys2 {0}

      run: |

        cd /tmp/ffmpeg


        make install




    - name: Check install

      shell: msys2 {0}

      run: |

        ls -lh /mingw64/bin/

        test -f /mingw64/bin/ffmpeg.exe

        test -f /mingw64/bin/ffprobe.exe


    #############################################
    # Verify
    #############################################

    - name: Verify

      shell: msys2 {0}

      run: |

        echo "===== FFmpeg ====="

        /mingw64/bin/ffmpeg -version


        echo "===== FDK AAC ====="

        /mingw64/bin/ffmpeg -encoders | grep fdk


        echo "===== MP3 ====="

        /mingw64/bin/ffmpeg -encoders | grep mp3




    #############################################
    # Package
    #############################################

    - name: Package

      shell: msys2 {0}

      run: |

        mkdir release

        cp /tmp/ffmpeg/ffmpeg.exe release/

        cp /tmp/ffmpeg/ffprobe.exe release/

        strip release/ffmpeg.exe

        strip release/ffprobe.exe

        ls -lh release




    - name: Upload Artifact

      uses: actions/upload-artifact@v4

      with:


        name: ffmpeg-windows-fdk-aac-audiobook


        path: release/




    #############################################
    # Release
    #############################################

    - name: GitHub Release

      if: startsWith(github.ref, 'refs/tags/')

      uses: softprops/action-gh-release@v2

      with:

        files: release/*