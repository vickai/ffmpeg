name: Build FFmpeg with libfdk_aac

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击运行

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git cmake yasm nasm pkg-config

      - name: Build libfdk_aac
        run: |
          git clone https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build FFmpeg
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          ./configure \
            --prefix=/usr/local \
            --enable-gpl \
            --enable-libfdk-aac \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-nonfree \
            --enable-shared \
            --enable-static
          make -j$(nproc)
          sudo make install

      - name: Pack binaries
        run: |
          mkdir -p ffmpeg_bin
          cp /usr/local/bin/ffmpeg /usr/local/bin/ffprobe ffmpeg_bin/
          tar -zcvf ffmpeg-linux-x86_64.tar.gz ffmpeg_bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-build
          path: ffmpeg-linux-x86_64.tar.gz
