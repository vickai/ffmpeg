name: Build FFmpeg Windows Full FDK-AAC

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"


env:
  FF_VERSION: master


jobs:

  build:

    runs-on: windows-2022

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          yasm
          nasm
          pkg-config
          autoconf
          automake
          libtool
          gcc
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake


    - name: Prepare environment
      shell: msys2 {0}
      run: |

        echo "PATH=/mingw64/bin:$PATH" >> $GITHUB_ENV

        git config --global core.autocrlf false



    #############################################
    # Build external libraries
    #############################################

    - name: Build fdk-aac
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git

        cd fdk-aac

        autoreconf -fiv

        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared

        make -j$(nproc)

        make install



    - name: Build x264
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone --depth=1 https://code.videolan.org/videolan/x264.git

        cd x264

        ./configure \
          --prefix=/mingw64 \
          --host=x86_64-w64-mingw32 \
          --enable-static \
          --disable-opencl

        make -j$(nproc)

        make install



    - name: Build x265
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone --depth=1 https://bitbucket.org/multicoreware/x265_git.git

        cd x265_git/source

        cmake \
          -G "MSYS Makefiles" \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          -DENABLE_SHARED=OFF \
          .

        make -j$(nproc)

        make install



    - name: Build opus
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone --depth=1 https://github.com/xiph/opus.git

        cd opus

        autoreconf -fiv

        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared

        make -j$(nproc)

        make install



    - name: Build libvpx
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone --depth=1 https://chromium.googlesource.com/webm/libvpx.git

        cd libvpx

        ./configure \
          --prefix=/mingw64 \
          --target=x86_64-win64-gcc \
          --disable-shared \
          --enable-static

        make -j$(nproc)

        make install



    #############################################
    # FFmpeg
    #############################################

    - name: Clone FFmpeg
      shell: msys2 {0}
      run: |

        cd /tmp

        git clone \
          --depth=1 \
          https://git.ffmpeg.org/ffmpeg.git

        cd ffmpeg

        git checkout $FF_VERSION



    - name: Configure FFmpeg
      shell: msys2 {0}
      run: |

        cd /tmp/ffmpeg


        ./configure \

          --prefix=/mingw64 \

          --pkg-config-flags="--static" \

          --extra-cflags="-static" \

          --extra-ldflags="-static" \

          --extra-libs="-lpthread -lws2_32 -lwinmm" \

          --arch=x86_64 \

          --target-os=mingw32 \

          --enable-cross-compile \

          --cc=x86_64-w64-mingw32-gcc \

          --enable-gpl \

          --enable-version3 \

          --enable-nonfree \

          --enable-static \

          --disable-shared \

          --disable-debug \

          --disable-doc \

          --enable-small \

          --enable-libfdk_aac \

          --enable-libx264 \

          --enable-libx265 \

          --enable-libopus \

          --enable-libvpx



    - name: Compile FFmpeg
      shell: msys2 {0}
      run: |

        cd /tmp/ffmpeg

        make -j$(nproc)



    - name: Install FFmpeg
      shell: msys2 {0}
      run: |

        cd /tmp/ffmpeg

        make install



    #############################################
    # Verify
    #############################################

    - name: Check encoder
      shell: msys2 {0}
      run: |

        ffmpeg -version

        ffmpeg -encoders | grep fdk



    #############################################
    # Package
    #############################################

    - name: Collect binary
      shell: bash
      run: |

        mkdir release

        cp /mingw64/bin/ffmpeg.exe release/

        strip release/ffmpeg.exe

        ls -lh release/ffmpeg.exe



    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:

        name: ffmpeg-windows-full-fdk-aac

        path: release/ffmpeg.exe



    #############################################
    # GitHub Release
    #############################################

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:

        files: release/ffmpeg.exe