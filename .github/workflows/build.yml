name: Build Static FFmpeg Windows (libfdk_aac, Single EXE)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      PREFIX: ${{ github.workspace }}/build_out
      W64DEVKIT: ${{ github.workspace }}/w64devkit/bin
    steps:
      - name: Fetch w64devkit (standalone MinGW toolchain)
        run: |
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-x64-1.23.0.zip" -OutFile w64devkit.zip
          Expand-Archive w64devkit.zip -DestinationPath w64devkit
          echo "${{ env.W64DEVKIT }}" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build static fdk-aac
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          mkdir build && cd build
          cmake -G "Unix Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%PREFIX% ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON ^
            ..
          make -j%NUMBER_OF_PROCESSORS%
          make install

      - name: Build FFmpeg (fully static)
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          set PKG_CONFIG_PATH=%PREFIX%/lib/pkgconfig
          ./configure ^
            --prefix=%PREFIX% ^
            --target-os=mingw32 ^
            --arch=x86_64 ^
            --enable-gpl ^
            --enable-nonfree ^
            --enable-libfdk-aac ^
            --enable-libmp3lame ^
            --enable-libopus ^
            --enable-libx264 ^
            --enable-libx265 ^
            --enable-libvpx ^
            --enable-static ^
            --disable-shared ^
            --disable-debug ^
            --disable-ffplay ^
            --disable-doc ^
            --extra-cflags="-I%PREFIX%/include" ^
            --extra-ldflags="-L%PREFIX%/lib -static -static-libgcc -static-libstdc++" ^
            --extra-libs="-lpthread"
          make -j%NUMBER_OF_PROCESSORS%
          make install

      - name: Package single EXEs
        shell: cmd
        run: |
          mkdir artifact
          copy %PREFIX%\bin\ffmpeg.exe artifact\
          copy %PREFIX%\bin\ffprobe.exe artifact\
          cd artifact
          zip ffmpeg-win64-static.zip ffmpeg.exe ffprobe.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-static
          path: artifact/ffmpeg-win64-static.zip
