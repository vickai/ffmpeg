name: Build FFmpeg Windows FDK AAC Audiobook Edition


on:

  workflow_dispatch:

  push:
    branches: [ main ]



env:

  FF_VERSION: master



jobs:


  build:


    runs-on: windows-2022


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install MSYS2
      uses: msys2/setup-msys2@v2

      with:

        msystem: MINGW64

        update: true

        install: >-
          git
          make
          yasm
          nasm
          pkg-config
          autoconf
          automake
          libtool
          gcc
          mingw-w64-x86_64-toolchain



    - name: Setup environment
      shell: bash

      run: |

        echo "/mingw64/bin" >> $GITHUB_PATH

        git config --global core.autocrlf false



    #############################################
    # libfdk-aac
    #############################################

    - name: Build libfdk-aac

      shell: msys2 {0}

      run: |


        cd /tmp


        git clone \
          --depth=1 \
          https://github.com/mstorsjo/fdk-aac.git



        cd fdk-aac



        autoreconf -fiv



        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared



        make -j$(nproc)


        make install





    #############################################
    # libmp3lame
    #############################################

    - name: Build lame

      shell: msys2 {0}

      run: |


        cd /tmp


        git clone \
          --depth=1 \
          https://github.com/lameproject/lame.git



        cd lame



        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared \
          --disable-frontend



        make -j$(nproc)



        make install





    #############################################
    # libopus
    #############################################

    - name: Build opus

      shell: msys2 {0}

      run: |


        cd /tmp


        git clone \
          --depth=1 \
          https://github.com/xiph/opus.git



        cd opus



        autoreconf -fiv



        ./configure \
          --prefix=/mingw64 \
          --enable-static \
          --disable-shared \
          --disable-extra-programs



        make -j$(nproc)



        make install





    #############################################
    # FFmpeg
    #############################################

    - name: Clone FFmpeg

      shell: msys2 {0}

      run: |


        cd /tmp


        git clone \
          --depth=1 \
          https://git.ffmpeg.org/ffmpeg.git



        cd ffmpeg



        git checkout $FF_VERSION





    - name: Configure FFmpeg

      shell: msys2 {0}

      run: |


        cd /tmp/ffmpeg



        ./configure \

          --prefix=/mingw64 \

          --pkg-config-flags="--static" \

          --extra-cflags="-static" \

          --extra-ldflags="-static" \

          --extra-libs="-lpthread -lws2_32 -lwinmm" \

          --arch=x86_64 \

          --target-os=mingw32 \

          --enable-cross-compile \

          --cc=x86_64-w64-mingw32-gcc \

          --enable-nonfree \

          --enable-version3 \

          --enable-static \

          --disable-shared \

          --disable-debug \

          --disable-doc \

          --disable-avdevice \

          --disable-ffplay \

          --disable-ffprobe \

          --enable-ffmpeg \

          --enable-libfdk_aac \

          --enable-libmp3lame \

          --enable-libopus





    - name: Compile FFmpeg

      shell: msys2 {0}

      run: |


        cd /tmp/ffmpeg


        make -j$(nproc)





    - name: Install FFmpeg

      shell: msys2 {0}

      run: |


        cd /tmp/ffmpeg


        make install





    #############################################
    # Verify
    #############################################

    - name: Verify build

      shell: msys2 {0}

      run: |


        /mingw64/bin/ffmpeg -version


        echo "==== AAC encoder ===="


        /mingw64/bin/ffmpeg -encoders | grep fdk


        echo "==== MP3 encoder ===="


        /mingw64/bin/ffmpeg -encoders | grep mp3





    #############################################
    # Package
    #############################################

    - name: Package

      shell: bash

      run: |


        mkdir release


        cp /mingw64/bin/ffmpeg.exe release/


        strip release/ffmpeg.exe


        ls -lh release/ffmpeg.exe





    - name: Upload artifact

      uses: actions/upload-artifact@v4

      with:


        name: ffmpeg-windows-fdk-aac-audiobook


        path: release/ffmpeg.exe





    #############################################
    # Release
    #############################################

    - name: GitHub Release

      if: startsWith(github.ref, 'refs/tags/')

      uses: softprops/action-gh-release@v2

      with:


        files: release/ffmpeg.exe