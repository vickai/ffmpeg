name: Build FFmpeg Windows (libfdk_aac)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-mingw64:
    runs-on: windows-latest
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            git
            yasm
            nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-opus

      - name: Build static fdk-aac
        shell: msys2 {0}
        run: |
          git clone https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          mkdir build && cd build
          cmake -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DBUILD_SHARED_LIBS=OFF \
            ..
          make -j$(nproc)
          make install

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          git clone https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          ./configure \
            --prefix=/mingw64 \
            --target-os=mingw64 \
            --arch=x86_64 \
            --enable-gpl \
            --enable-nonfree \
            --enable-libfdk-aac \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-static \
            --disable-shared \
            --pkg-config-flags="--static" \
            --extra-libs="-lpthread -lm" \
            --disable-debug
          make -j$(nproc)
          make install

      - name: Collect binaries
        shell: msys2 {0}
        run: |
          mkdir -p output
          cp /mingw64/bin/ffmpeg.exe output/
          cp /mingw64/bin/ffprobe.exe output/
          cd output
          zip -r ffmpeg-windows-x86_64.zip ffmpeg.exe ffprobe.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: output/ffmpeg-windows-x86_64.zip
