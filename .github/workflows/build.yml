name: Build FFmpeg with FDK-AAC (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        choco install -y nasm
        choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install -y ninja
        choco install -y git

    - name: Clone FDK-AAC
      run: |
        git clone https://github.com/mstorsjo/fdk-aac.git "${{ github.workspace }}\\fdk-aac"

    - name: Build FDK-AAC
      run: |
        cmake -S "${{ github.workspace }}\\fdk-aac" -B "${{ github.workspace }}\\fdk-aac\\build" -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build "${{ github.workspace }}\\fdk-aac\\build"
        cmake --install "${{ github.workspace }}\\fdk-aac\\build" --prefix "${{ github.workspace }}\\install"

    - name: Clone FFmpeg
      run: |
        git clone https://github.com/FFmpeg/FFmpeg.git "${{ github.workspace }}\\FFmpeg"

    - name: Configure FFmpeg
      run: |
        cd "${{ github.workspace }}\\FFmpeg"
        ./configure ^
          --toolchain=msvc ^
          --enable-libfdk-aac ^
          --enable-nonfree ^
          --enable-gpl ^
          --extra-cflags="-I${{ github.workspace }}\\install\\include" ^
          --extra-ldflags="-L${{ github.workspace }}\\install\\lib"

    - name: Build FFmpeg
      run: |
        cd "${{ github.workspace }}\\FFmpeg"
        nmake

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-fdk-aac-windows
        path: "${{ github.workspace }}\\FFmpeg\\ffmpeg.exe"
